<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MoSCoW Day Planner</title>
<style>
:root { --page-bg: #f4f5f7; --page-ink: #1b2330; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --page-bg: #11151c; --page-ink: #e8ecf3; color-scheme: dark; } }
:root[data-theme="dark"] { --page-bg: #11151c; --page-ink: #e8ecf3; color-scheme: dark; }
html, body { margin: 0; min-height: 100%; background: var(--page-bg); color: var(--page-ink); }
#app { display: block; min-height: 100vh; }
</style>
</head>
<body>
<div id="app"></div>
<script>/*BUNDLE*/</script>
<script>
(function () {
  var host = document.getElementById("app");
  function sync() {
    var t = document.documentElement.getAttribute("data-theme");
    if (t) host.setAttribute("data-theme", t); else host.removeAttribute("data-theme");
  }
  sync();
  new MutationObserver(sync).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  window.MoscowPlanner.start(host);
})();
</script>
</body>
</html>
